# merge → 本机 KB ingest（self-hosted + localhost API）
name: KB Merge Ingest

on:
  push:
    branches: [main]

jobs:
  ingest-validate:
    runs-on: [self-hosted, macOS, kb-local]
    env:
      ENGINEERING_KB_API: http://127.0.0.1:8090/api
      ENGINEERING_KB_PROJECT_ID: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check local KB API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$ENGINEERING_KB_API/health" || echo "000")
          if [ "$code" != "200" ]; then
            echo "::error::KB API not reachable at $ENGINEERING_KB_API — start backend first"
            exit 1
          fi

      - name: Ingest + validate
        env:
          ENGINEERING_KB_SCRIPTS: ${{ github.workspace }}/kb-scripts
          CODE_REPO: ${{ github.workspace }}
          RUN_GITNEXUS: "false"
        run: bash "$ENGINEERING_KB_SCRIPTS/ci/kb-ci-pipeline.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb-ingest-artifacts
          path: .kb-ci/
