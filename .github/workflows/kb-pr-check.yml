# sdd-kb-test — PR 自动审核
# 事件：pull_request → 自动跑 kb-pr-check workflow

name: KB PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3 python3-yaml curl

      - name: Install Claude Code CLI (Agent runtime)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY required — PR review is Agent-driven, not rule fallback"
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Gather PR artifacts (tools)
        env:
          ENGINEERING_KB_SCRIPTS: ${{ github.workspace }}/kb-scripts
          ENGINEERING_KB_API: ${{ secrets.ENGINEERING_KB_API }}
          ENGINEERING_KB_PROJECT_ID: ${{ secrets.ENGINEERING_KB_PROJECT_ID || '1' }}
          ENGINEERING_KB_TOKEN: ${{ secrets.ENGINEERING_KB_TOKEN }}
          CODE_REPO: ${{ github.workspace }}
          GIT_BASE: origin/main
          GIT_HEAD: HEAD
        run: bash "$ENGINEERING_KB_SCRIPTS/ci/kb-pr-gather.sh"

      - name: AI Agent review (required)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENGINEERING_KB_SCRIPTS: ${{ github.workspace }}/kb-scripts
          CODE_REPO: ${{ github.workspace }}
        run: bash "$ENGINEERING_KB_SCRIPTS/ci/kb-pr-agent.sh"

      - name: Enforce Agent verdict
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(".kb-ci/pr-review.json")
          if not p.exists():
              print("::error::pr-review.json missing — Agent step failed")
              sys.exit(1)
          r = json.loads(p.read_text())
          verdict = r.get("verdict", "")
          if verdict == "approve":
              print(f"Agent verdict: {verdict}")
              sys.exit(0)
          print(f"::error::Agent verdict: {verdict} — {r.get('summary', '')}")
          sys.exit(1)
          PY

      - name: Post PR comment with Agent verdict
        if: always() && hashFiles('.kb-ci/pr-review.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERDICT=$(python3 -c "import json; print(json.load(open('.kb-ci/pr-review.json')).get('verdict','?'))")
          SUMMARY=$(python3 -c "import json; print(json.load(open('.kb-ci/pr-review.json')).get('summary',''))")
          gh pr comment "${{ github.event.pull_request.number }}" --body "## KB Agent Review
          **Verdict**: \`${VERDICT}\`
          ${SUMMARY}
          Artifacts: workflow run → kb-pr-artifacts"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb-pr-artifacts
          path: .kb-ci/
