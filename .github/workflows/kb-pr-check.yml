# sdd-kb-test — PR 自动审核（self-hosted：本机 CC Switch + localhost KB）
name: KB PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-analyze:
    runs-on: [self-hosted, macOS, kb-local]
    env:
      ENGINEERING_KB_API: http://127.0.0.1:8090/api
      ENGINEERING_KB_PROJECT_ID: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify local toolchain (CC Switch / claude CLI)
        run: |
          command -v claude || { echo "::error::claude not found — CC Switch or brew install claude-code"; exit 1; }
          command -v python3 || exit 1
          claude --version
          if [ -f "$HOME/.claude/settings.json" ]; then
            echo "Using CC Switch / ~/.claude/settings.json"
          else
            echo "::warning::No ~/.claude/settings.json — ensure ANTHROPIC_* env is set for claude -p"
          fi

      - name: Check local KB API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$ENGINEERING_KB_API/health" || echo "000")
          if [ "$code" != "200" ]; then
            echo "::warning::KB API $ENGINEERING_KB_API health=$code — start: 工程化知识库/ci/run-backend.sh"
          fi

      - name: Gather PR artifacts (tools)
        env:
          ENGINEERING_KB_SCRIPTS: ${{ github.workspace }}/kb-scripts
          CODE_REPO: ${{ github.workspace }}
          GIT_BASE: origin/main
          GIT_HEAD: HEAD
        run: bash "$ENGINEERING_KB_SCRIPTS/ci/kb-pr-gather.sh"

      - name: AI Agent review (required)
        env:
          ENGINEERING_KB_SCRIPTS: ${{ github.workspace }}/kb-scripts
          CODE_REPO: ${{ github.workspace }}
        run: bash "$ENGINEERING_KB_SCRIPTS/ci/kb-pr-agent.sh"

      - name: Enforce Agent verdict
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(".kb-ci/pr-review.json")
          if not p.exists():
              print("::error::pr-review.json missing — Agent step failed")
              sys.exit(1)
          r = json.loads(p.read_text())
          verdict = r.get("verdict", "")
          if verdict == "approve":
              print(f"Agent verdict: {verdict}")
              sys.exit(0)
          print(f"::error::Agent verdict: {verdict} — {r.get('summary', '')}")
          sys.exit(1)
          PY

      - name: Post PR comment with Agent verdict
        if: always() && hashFiles('.kb-ci/pr-review.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { echo "::warning::gh not installed — skip PR comment"; exit 0; }
          VERDICT=$(python3 -c "import json; print(json.load(open('.kb-ci/pr-review.json')).get('verdict','?'))")
          SUMMARY=$(python3 -c "import json; print(json.load(open('.kb-ci/pr-review.json')).get('summary',''))")
          gh pr comment "${{ github.event.pull_request.number }}" --body "## KB Agent Review (self-hosted)
          **Verdict**: \`${VERDICT}\`
          ${SUMMARY}
          Runner: \`kb-local\` on macOS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb-pr-artifacts
          path: .kb-ci/
